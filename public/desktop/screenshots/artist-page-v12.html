.artist-page::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background:
    radial-gradient(circle at 82% 12%, rgba(215,164,94,.11), transparent 30%),
    radial-gradient(circle at 18% 60%, rgba(255,255,255,.035), transparent 25%),
    linear-gradient(90deg, rgba(0,0,0,.28), transparent 20%, transparent 80%, rgba(0,0,0,.28));
}

.hero-shell,
.content-shell {
  width: min(1180px, calc(100% - 88px));
  margin-inline: auto;
}

.hero-shell {
  min-height: 760px;
  display: grid;
  grid-template-columns: 1fr .9fr;
  align-items: center;
  gap: 54px;
  position: relative;
  padding: 86px 0 50px;
}

.ambient {
  position: absolute;
  border: 1px solid rgba(215,164,94,.18);
  border-radius: 50%;
  pointer-events: none;
}
.ambient--one { width: 920px; height: 920px; left: -260px; top: -210px; }
.ambient--two { width: 730px; height: 730px; right: -300px; top: -60px; }

.hero-copy { position: relative; z-index: 2; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 34px;
  color: var(--gold);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .38em;
  text-transform: uppercase;
}
.eyebrow b,
.section-title b,
.connect b { color: var(--red); font-weight: 400; }

h1 {
  margin: 0 0 26px;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(80px, 9vw, 146px);
  line-height: .8;
  letter-spacing: -.055em;
}

.tags { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 48px; }
.tags span {
  min-width: 174px;
  padding: 14px 24px 12px;
  border: 1px solid rgba(215,164,94,.75);
  border-radius: 999px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: 14px;
}

.intro {
  max-width: 500px;
  margin: 0;
  color: #d9d2c8;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 23px;
  line-height: 1.7;
}

.portrait-stage {
  position: relative;
  width: min(490px, 42vw);
  aspect-ratio: .78;
  justify-self: end;
  display: grid;
  place-items: center;
}

.portrait-frame {
  position: relative;
  width: 77%;
  height: 82%;
  border: 1px solid rgba(215,164,94,.92);
  border-radius: 46% 46% 44% 44% / 28% 28% 22% 22%;
  overflow: hidden;
  box-shadow: 0 22px 70px rgba(0,0,0,.5), inset 0 0 0 7px rgba(215,164,94,.05);
  background: #111;
}
.portrait-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.20));
}
.portrait-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(1.03);
  transform: scale(1.05);
}

.orbit {
  position: absolute;
  border: 1px solid rgba(215,164,94,.42);
  border-radius: 48% 48% 47% 47% / 31% 31% 24% 24%;
}
.orbit--1 { width: 83%; height: 88%; }
